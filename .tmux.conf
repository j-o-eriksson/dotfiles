set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
# Truecolor, whatever the outer terminal calls itself.
set -as terminal-features ',*:RGB'

set -g status-position top
set -g mouse on
set -g base-index 1
set -sg escape-time 0
set -g renumber-windows on
set -g allow-rename off
set -g focus-events on
# Copies reach the outer terminal's clipboard (OSC 52), also from tmux on a remote box.
set -s set-clipboard on

# Vim-style pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# vim-like pane resizing
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

bind -n M-t new-window
bind -n M-2 next-window
bind -n M-1 previous-window
bind -n M-w kill-pane

# rebind maximize pane
bind -n M-z resize-pane -Z

# Scrolling and copying in tmux
setw -g mode-keys vi
bind k copy-mode
# TODO: Check if second 'v'-press can cancel selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# On the laptop this tmux only switches between boxes, each running its own tmux (`tm box`).
# F12 hands every key to the box's tmux and hides this status bar; F12 again takes them back.
if-shell '[ -z "$SSH_CONNECTION" ]' {
  set -g status-position bottom
  bind -T root F12 {
    set prefix None
    set key-table off
    set status off
    if -F '#{pane_in_mode}' { send -X cancel }
  }
  bind -T off F12 {
    set -u prefix
    set -u key-table
    set -u status
  }
}

# catppuccin (v2)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %H:%M:%S"
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"

# List of plugins
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tpm'

# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
